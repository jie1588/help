<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>使用说明</title>
<style>
  :root{
    --text:#1f2329; --text-2:#646a73; --text-3:#8f959e;
    --line:#e5e6eb; --bg:#fff; --bg-2:#f5f6f7; --blue:#3370ff; --blue-soft:#eef3ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.75;font-size:16px;}
  .wrap{max-width:720px;margin:0 auto;padding:52px 24px 88px;}
  .pill{display:inline-block;font-size:13px;padding:4px 12px;border-radius:20px;background:var(--blue-soft);
    color:var(--blue);font-weight:500;margin-bottom:16px;}
  h1{font-size:30px;line-height:1.3;font-weight:700;margin:0 0 10px;letter-spacing:-.5px;}
  .sub{color:var(--text-3);font-size:14px;margin:0 0 28px;}
  .tip{background:var(--bg-2);border-radius:8px;padding:14px 18px;margin:0 0 36px;font-size:15px;
    border-left:3px solid var(--blue);}
  .h2{font-size:16px;font-weight:600;margin:40px 0 14px;color:var(--text-2);letter-spacing:.5px;}
  .row{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);
    border-radius:8px;margin-bottom:10px;cursor:pointer;transition:background .15s,border-color .15s;background:#fff;}
  .row:hover{background:#fafbfc;border-color:#d0d3d9;}
  .play{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--blue-soft);
    display:flex;align-items:center;justify-content:center;}
  .play svg{width:12px;height:12px;fill:var(--blue);}
  .row-main{flex:1;min-width:0;}
  .row-name{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-desc{font-size:13px;color:var(--text-3);margin-top:2px;}
  .badge{flex:0 0 auto;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--blue-soft);
    color:var(--blue);font-weight:500;}
  .badge.alt{background:#fff4e6;color:#de7802;}
  .player-box{position:relative;display:none;margin:-4px 0 16px;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;background:#000;}
  .player-box video{width:100%;display:block;max-height:80vh;background:#000;object-fit:contain;}
  /* 自制控制条 */
  .cbar{position:absolute;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:10px;
    background:linear-gradient(transparent,rgba(0,0,0,.62));}
  .cbtn{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .cbtn svg{width:20px;height:20px;fill:#fff;}
  .track{flex:1;position:relative;height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none;}
  .rail{position:relative;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.3);}
  .buffered{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:rgba(255,255,255,.45);width:0;}
  .played{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:var(--blue);width:0;}
  .thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);left:0;box-shadow:0 0 4px rgba(0,0,0,.4);}
  .timetxt{flex:0 0 auto;color:#fff;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .spinner{position:absolute;top:50%;left:50%;width:42px;height:42px;margin:-21px 0 0 -21px;display:none;
    border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fail{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:#fff;background:rgba(0,0,0,.7);font-size:14px;cursor:pointer;}
  /* 图片（二维码）区 */
  .img-grid{display:flex;flex-wrap:wrap;gap:14px;}
  .img-card{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;text-align:center;
    width:calc(50% - 7px);max-width:220px;}
  .img-card img{width:100%;display:block;border-radius:6px;background:var(--bg-2);}
  .img-card .cap{font-size:13px;color:var(--text-3);margin-top:8px;}
  .link-card{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;
    border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:10px;color:var(--text);
    transition:background .15s,border-color .15s;}
  .link-card:hover{background:#fafbfc;border-color:#d0d3d9;}
  .link-card .lk-t{font-size:16px;font-weight:600;}
  .link-card .lk-d{font-size:13px;color:var(--text-3);margin-top:2px;}
  .link-card .arrow{color:var(--blue);font-size:15px;flex:0 0 auto;}
  .foot{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--text-3);}
  @media (max-width:520px){
    .wrap{padding:34px 16px 64px;}
    h1{font-size:24px;}
    .row{padding:14px;}
    .badge{display:none;}
    .img-card{width:calc(50% - 7px);}
  }
</style>
</head>
<body oncontextmenu="return false">
<div class="wrap">
  <span class="pill" id="t-pill"></span>

  <div class="tip" id="t-tip"></div>

  <div class="h2" id="v-head">操作视频</div>
  <div id="sec-wrap"></div>

  <div id="img-sec" style="display:none">
    <div class="h2">下载 / 扫码</div>
    <div class="img-grid" id="img-wrap"></div>
  </div>

  <div class="h2" id="l-head">相关链接</div>
  <div id="link-wrap"></div>

  <div class="foot" id="t-foot"></div>
</div>

<script>
/* ============================================================

const CONFIG = {

      { 名称: "KK 下载地址", 说明: "复制到手机浏览器打开", 地址: "https://wwsk.lanzouu.com/s/wowkeji" }

        { 名称: "无障碍教程", 说明: "不用点击器，无障碍模式", 标签: "无障碍", 地址: "EBxZGBZWXwJVWUZeDQoDCwoBX0dbVQMDQFACAAAAAAJAVV5TGRtIG0oIH1pcXF1XHEdbWUoUGABTXEYYFRgZ" }
      ]
    },
    tx: {
      名称: "TX", 标题: "TX 脚本使用说明",
      视频: [
        { 名称: "OTG 蓝牙教程", 说明: "用蓝牙点击器操作", 标签: "蓝牙", 地址: "EBxZGBZWXwJVWUZeDQoDCwoBX0dbVQMDQFACAAAAAAJAVV5TGRtIG0oIH1pcXF1XHEdbWUoYCABQRBxbCFw=" },
        { 名称: "无障碍教程", 说明: "不用点击器，无障碍模式", 标签: "无障碍", 地址: "EBxZGBZWXwJVWUZeDQoDCwoBX0dbVQMDQFACAAAAAAJAVV5TGRtIG0oIH1pcXF1XHEdbWUoYCABTXEYYFRgZ" }
      ]
    },
    jj: {
      名称: "掘金", 标题: "掘金脚本使用说明",
      视频: [
        { 名称: "OTG 蓝牙教程", 说明: "用蓝牙点击器操作", 标签: "蓝牙", 地址: "EBxZGBZWXwJVWUZeDQoDCwoBX0dbVQMDQFACAAAAAAJAVV5TGRtIG0oIH1pcXF1XHEdbWUoGGgBQRBxbCFw=" },
        { 名称: "无障碍教程", 说明: "不用点击器，无障碍模式", 标签: "无障碍", 地址: "EBxZGBZWXwJVWUZeDQoDCwoBX0dbVQMDQFACAAAAAAJAVV5TGRtIG0oIH1pcXF1XHEdbWUoGGgBTXEYYFRgZ" }
      ]
    },
    lbt: {
      名称: "萝卜头", 标题: "萝卜头脚本使用说明",
      视频: [
        { 名称: "OTG 蓝牙教程", 说明: "用蓝牙点击器操作", 标签: "蓝牙", 地址: "EBxZGBZWXwJVWUZeDQoDCwoBX0dbVQMDQFACAAAAAAJAVV5TGRtIG0oIH1pcXF1XHEdbWUoAElkfUkYYFRgZ" },
        { 名称: "无障碍教程", 说明: "不用点击器，无障碍模式", 标签: "无障碍", 地址: "EBxZGBZWXwJVWUZeDQoDCwoBX0dbVQMDQFACAAAAAAJAVV5TGRtIG0oIH1pcXF1XHEdbWUoAElkfUV5CVgVdXA==" }
      ]
    },
    fqy: {
      名称: "FQY", 标题: "FQY 脚本使用说明",
      视频: [
        { 名称: "OTG 蓝牙教程", 说明: "用蓝牙点击器操作", 标签: "蓝牙", 地址: "EBxZGBZWXwJVWUZeDQoDCwoBX0dbVQMDQFACAAAAAAJAVV5TGRtIG0oIH1pcXF1XHEdbWUoKAVQfUkYYFRgZ" },
        { 名称: "无障碍教程", 说明: "不用点击器，无障碍模式", 标签: "无障碍", 地址: "EBxZGBZWXwJVWUZeDQoDCwoBX0dbVQMDQFACAAAAAAJAVV5TGRtIG0oIH1pcXF1XHEdbWUoKAVQfUV5CVgVdXA==" }
      ]
    }
  }
};
/* ======================== 配置区结束 ======================== */

const PLAY_SVG = '<svg viewBox="0 0 1024 1024"><path d="M768 512L320 224v576z"/></svg>';
const PAUSE_SVG = '<svg viewBox="0 0 1024 1024"><path d="M304 192h144v640H304zM576 192h144v640H576z"/></svg>';
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

const params = new URLSearchParams(location.search);
const key = (params.get("s") || "xh").toLowerCase();
const G = CONFIG.全局;
const S = CONFIG.脚本[key] || CONFIG.脚本.xh;
const me = Object.assign({}, G, S);
me.链接 = S.链接 || G.链接;
me.图片 = S.图片 || G.图片;

document.getElementById("t-pill").textContent = me.名称;
document.getElementById("t-title").textContent = me.标题;
document.getElementById("t-sub").textContent = me.副标题;
document.getElementById("t-tip").textContent = me.提示;
document.getElementById("t-foot").textContent = me.页脚;
document.title = me.标题;

/* 地址密文，运行时解密 */
function _d(s){
  if(!s){ return ""; }
  const k = new TextEncoder().encode("xh-help-2026");
  const b = Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); });
  return new TextDecoder().decode(b.map(function(v,i){ return v ^ k[i % k.length]; }));
}
/* 代理前缀（密文）；末项空串 = 官方直连，原生媒体无需 CORS */
const PROXY_PREFIXES = [
  "EBxZGBZWXwJVWB9GCgdVEUsPH0Ad",
  "EBxZGBZWXwJVWUZeDQoAGBcDCFQcXFtOAAFDD0sYH10d",
  ""
].map(_d);

function fmt(t){
  if(!isFinite(t)){ return "0:00"; }
  t = Math.max(0, Math.floor(t));
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
  const mm = h && m<10 ? "0"+m : ""+m;
  const ss = s<10 ? "0"+s : ""+s;
  return (h ? h+":" : "") + mm + ":" + ss;
}

let playerBox = null;
const wrapEl = document.getElementById("sec-wrap");
(me.视频 || []).forEach(function(v){
  const row = document.createElement("div");
  row.className = "row";
  const cls = v.标签 === "蓝牙" ? "badge" : "badge alt";
  row.innerHTML = '<div class="play">' + PLAY_SVG + '</div>' +
    '<div class="row-main"><div class="row-name">' + esc(v.名称) + '</div>' +
    '<div class="row-desc">' + esc(v.说明) + '</div></div>' +
    '<div class="' + cls + '">' + esc(v.标签) + '</div>';
  row.addEventListener("click", function(){ openPlayer(row, v); });
  wrapEl.appendChild(row);
});

function openPlayer(row, v){
  if(playerBox && playerBox.dataset.src === v.地址 && playerBox.style.display === "block"){
    playerBox.remove(); playerBox = null; return;
  }
  if(playerBox){ playerBox.remove(); playerBox = null; }

  const box = document.createElement("div");
  box.className = "player-box";
  box.style.display = "block";
  box.dataset.src = v.地址;

  const video = document.createElement("video");
  video.playsInline = true;
  video.preload = "metadata";
  video.setAttribute("controlsList", "nodownload");
  video.setAttribute("disablePictureInPicture", "true");
  video.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  /* 控制条 */
  const cbar = document.createElement("div");
  cbar.className = "cbar";
  cbar.innerHTML =
    '<div class="cbtn playbtn"></div>' +
    '<div class="track"><div class="rail"><div class="buffered"></div><div class="played"></div><div class="thumb"></div></div></div>' +
    '<div class="timetxt">0:00 / 0:00</div>';
  const spinner = document.createElement("div"); spinner.className="spinner";
  const fail = document.createElement("div"); fail.className="fail";
  fail.innerHTML = '<div>加载失败，点击重试</div>';

  box.appendChild(video);
  box.appendChild(spinner);
  box.appendChild(fail);
  box.appendChild(cbar);

  const playbtn = cbar.querySelector(".playbtn");
  const track = cbar.querySelector(".track");
  const rail = cbar.querySelector(".rail");
  const bufferedEl = cbar.querySelector(".buffered");
  const playedEl = cbar.querySelector(".played");
  const thumbEl = cbar.querySelector(".thumb");
  const timeEl = cbar.querySelector(".timetxt");
  playbtn.innerHTML = PLAY_SVG;

  /* 候选源：各代理 + 直连，失败自动切换 */
  const path = _d(v.地址);
  const sources = PROXY_PREFIXES.map(function(p){ return p + path; });
  let srcIdx = 0;
  function loadSrc(){
    fail.style.display = "none";
    video.src = sources[srcIdx];
    video.load();
  }
  video.addEventListener("error", function(){
    if(srcIdx < sources.length - 1){ srcIdx++; loadSrc(); }
    else { spinner.style.display="none"; fail.style.display="flex"; }
  });
  fail.addEventListener("click", function(){ srcIdx = 0; loadSrc(); });

  /* 播放/暂停按钮 */
  function togglePlay(){
    if(video.paused || video.ended){ video.play(); } else { video.pause(); }
  }
  playbtn.addEventListener("click", function(e){ e.stopPropagation(); togglePlay(); });
  video.addEventListener("click", togglePlay);
  video.addEventListener("play", function(){ playbtn.innerHTML = PAUSE_SVG; });
  video.addEventListener("pause", function(){ playbtn.innerHTML = PLAY_SVG; });
  video.addEventListener("ended", function(){ playbtn.innerHTML = PLAY_SVG; });

  /* 进度更新 */
  let dragging = false;
  function updateProgress(){
    const d = video.duration || 0;
    if(!dragging && d){
      const ratio = video.currentTime / d;
      playedEl.style.width = (ratio*100)+"%";
      thumbEl.style.left = (ratio*100)+"%";
    }
    let end = 0;
    for(let i=0;i<video.buffered.length;i++){
      if(video.buffered.start(i) <= video.currentTime + 0.5){ end = Math.max(end, video.buffered.end(i)); }
    }
    if(d){ bufferedEl.style.width = Math.min(100,(end/d)*100)+"%"; }
    timeEl.textContent = fmt(video.currentTime) + " / " + fmt(d);
  }
  video.addEventListener("loadedmetadata", updateProgress);
  video.addEventListener("timeupdate", updateProgress);
  video.addEventListener("progress", updateProgress);

  /* 等待/加载指示 */
  video.addEventListener("waiting", function(){ spinner.style.display="block"; });
  video.addEventListener("playing", function(){ spinner.style.display="none"; });
  video.addEventListener("canplay", function(){ spinner.style.display="none"; });

  /* 拖动/点击进度条：原生 Range 处理未缓冲跳转 */
  function ratioFromX(clientX){
    const r = rail.getBoundingClientRect();
    return Math.min(1, Math.max(0, (clientX - r.left)/r.width));
  }
  function seekToRatio(r){
    if(video.duration){ video.currentTime = r * video.duration; }
  }
  track.addEventListener("pointerdown", function(e){
    dragging = true;
    try{ track.setPointerCapture(e.pointerId); }catch(_){}
    const r = ratioFromX(e.clientX);
    playedEl.style.width = (r*100)+"%";
    thumbEl.style.left = (r*100)+"%";
  });
  track.addEventListener("pointermove", function(e){
    if(!dragging){ return; }
    const r = ratioFromX(e.clientX);
    playedEl.style.width = (r*100)+"%";
    thumbEl.style.left = (r*100)+"%";
  });
  function endDrag(e){
    if(!dragging){ return; }
    dragging = false;
    seekToRatio(ratioFromX(e.clientX));
    updateProgress();
  }
  track.addEventListener("pointerup", endDrag);
  track.addEventListener("pointercancel", function(){ dragging=false; updateProgress(); });

  row.insertAdjacentElement("afterend", box);
  playerBox = box;

  loadSrc();
  video.play().catch(function(){});
}

/* 图片（二维码）区 */
if(me.图片 && me.图片.length){
  document.getElementById("img-sec").style.display = "block";
  const iw = document.getElementById("img-wrap");
  me.图片.forEach(function(it){
    const card = document.createElement("div");
    card.className = "img-card";
    card.innerHTML = '<img src="' + esc(it.文件) + '" alt="' + esc(it.说明 || "") + '" loading="lazy">' +
      '<div class="cap">' + esc(it.说明 || "") + '</div>';
    iw.appendChild(card);
  });
}

/* 链接区 */
const lw = document.getElementById("link-wrap");
(me.链接 || []).forEach(function(l){
  const a = document.createElement("a");
  a.className = "link-card";
  a.href = l.地址; a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = '<div><div class="lk-t">' + esc(l.名称) + '</div><div class="lk-d">' + esc(l.说明) + '</div></div>' +
    '<div class="arrow">→</div>';
  lw.appendChild(a);
});
</script>
</body>
</html>
