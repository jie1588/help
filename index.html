<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>使用说明</title>
<style>
  :root{
    --text:#1f2329; --text-2:#646a73; --text-3:#8f959e;
    --line:#e5e6eb; --bg:#fff; --bg-2:#f5f6f7; --blue:#3370ff; --blue-soft:#eef3ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.75;font-size:16px;}
  .wrap{max-width:720px;margin:0 auto;padding:52px 24px 88px;}
  .pill{display:inline-block;font-size:13px;padding:4px 12px;border-radius:20px;background:var(--blue-soft);
    color:var(--blue);font-weight:500;margin-bottom:16px;}
  h1{font-size:30px;line-height:1.3;font-weight:700;margin:0 0 10px;letter-spacing:-.5px;}
  .sub{color:var(--text-3);font-size:14px;margin:0 0 28px;}
  .tip{background:var(--bg-2);border-radius:8px;padding:14px 18px;margin:0 0 36px;font-size:15px;
    border-left:3px solid var(--blue);}
  .h2{font-size:16px;font-weight:600;margin:40px 0 14px;color:var(--text-2);letter-spacing:.5px;}
  .row{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);
    border-radius:8px;margin-bottom:10px;cursor:pointer;transition:background .15s,border-color .15s;background:#fff;}
  .row:hover{background:#fafbfc;border-color:#d0d3d9;}
  .play{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--blue-soft);
    display:flex;align-items:center;justify-content:center;}
  .play svg{width:12px;height:12px;fill:var(--blue);}
  .row-main{flex:1;min-width:0;}
  .row-name{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-desc{font-size:13px;color:var(--text-3);margin-top:2px;}
  .badge{flex:0 0 auto;font-size:12px;padding:3px 10px;border-radius:20px;background:var(--blue-soft);
    color:var(--blue);font-weight:500;}
  .badge.alt{background:#fff4e6;color:#de7802;}
  .player-box{display:none;margin:-4px 0 16px;border:1px solid var(--line);border-radius:8px;
    overflow:hidden;background:#000;}
  .player-box video{width:100%;display:block;max-height:78vh;background:#000;}
  /* 图片（二维码）区 */
  .img-grid{display:flex;flex-wrap:wrap;gap:14px;}
  .img-card{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;text-align:center;
    width:calc(50% - 7px);max-width:220px;}
  .img-card img{width:100%;display:block;border-radius:6px;background:var(--bg-2);}
  .img-card .cap{font-size:13px;color:var(--text-3);margin-top:8px;}
  .link-card{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;
    border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:10px;color:var(--text);
    transition:background .15s,border-color .15s;}
  .link-card:hover{background:#fafbfc;border-color:#d0d3d9;}
  .link-card .lk-t{font-size:16px;font-weight:600;}
  .link-card .lk-d{font-size:13px;color:var(--text-3);margin-top:2px;}
  .link-card .arrow{color:var(--blue);font-size:15px;flex:0 0 auto;}
  .foot{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--text-3);}
  @media (max-width:520px){
    .wrap{padding:34px 16px 64px;}
    h1{font-size:24px;}
    .row{padding:14px;}
    .badge{display:none;}
    .img-card{width:calc(50% - 7px);}
  }
</style>
</head>

const DUR = {"lbt-alt":469.57,"tx-alt":610.18,"lbt-bt":583.49,"fqy-alt":551.1,"xh-bt":921.86,"xh-alt":528.24,"jj-bt":553.67,"jj-alt":630.4,"tx-bt":683.22,"fqy-bt":511.85};

function decBytes(off, buf){
  for(let i = 0; i < buf.length; i++){ buf[i] ^= KEY_BYTES[(off + i) & 255]; }
  return buf;
}

async function fetchRange(urls, start, end){
  let err;
  for(let ui = 0; ui < urls.length; ui++){
    try{
      const r = await fetch(urls[ui], {
        headers: { Range: "bytes=" + start + "-" + (end ? (end - 1) : "") },
        cache: "no-store"
      });
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r;
    }catch(e){ err = e; }
  }
  throw err || new Error("network down");
}

function appendBuf(sb, video, bytes){
  return new Promise(function(res, rej){
    function go(){
      try{ sb.appendBuffer(bytes); }
      catch(e){
        if(e.name === "QuotaExceededError"){
          const cut = Math.max(0, video.currentTime - 60);
          sb.addEventListener("updateend", function(){
            try{ sb.remove(0, cut); }catch(_){}
            sb.addEventListener("updateend", go, { once: true });
          }, { once: true });
        } else { rej(e); }
        return;
      }
      sb.addEventListener("updateend", function(){ res(); }, { once: true });
    }
    if(sb.updating){ sb.addEventListener("updateend", go, { once: true }); } else { go(); }
  });
}

function inRange(sb, t){
  for(let i = 0; i < sb.buffered.length; i++){
    if(t >= sb.buffered.start(i) && t <= sb.buffered.end(i)) return true;
  }
  return false;
}

function startEngine(video, cipher, onUnsupported){
  const urls = PROXY_PREFIXES.map(function(p){ return p + _d(cipher); });
  const name = _d(cipher).match(/\/([a-z0-9-]+)\.dat/)[1];
  const flat = IDX[name];
  const initEnd = flat[0];
  const ms = new MS_CTX();
  const blobUrl = URL.createObjectURL(ms);
  video.src = blobUrl;
  let sb = null, aborted = false, reader = null, token = 0, initDone = false;

  function abortAll(){
    aborted = true; token++;
    try{ if(reader){ reader.cancel(); } }catch(e){}
    try{ URL.revokeObjectURL(blobUrl); }catch(e){}
  }
  video._abortEngine = abortAll;

  /* 检测可能误报，addSourceBuffer 仍按 精确→宽松 全部尝试一遍 */
  function makeSB(){
    const tries = [];
    if(MSE_CODEC){ tries.push(MSE_CODEC); }
    for(let i = 0; i < CODEC_PAIRS.length; i++){
      const t = typeOf(CODEC_PAIRS[i]);
      if(tries.indexOf(t) < 0){ tries.push(t); }
    }
    let lastErr = null;
    for(let i = 0; i < tries.length; i++){
      try{ return ms.addSourceBuffer(tries[i]); }
      catch(e){ lastErr = e; }
    }
    throw lastErr || new Error("mse unsupported");
  }

  ms.addEventListener("sourceopen", async function(){
    try{
      sb = makeSB();
      try{ sb.mode = "segments"; }catch(e){}
      try{ ms.duration = DUR[name]; }catch(e){}
      const r0 = await fetchRange(urls, 0, initEnd);
      const b0 = new Uint8Array(await r0.arrayBuffer());
      await appendBuf(sb, video, decBytes(0, b0));
      initDone = true;
      pump(initEnd);
    }catch(e){
      if(aborted){ return; }
      if(typeof onUnsupported === "function"){ onUnsupported(); }
    }
  });

  async function pump(from){
    const my = ++token;
    let off = from, firstAppend = true;
    console.log("[pump] start my=" + my + " from=" + from);
    try{
      const resp = await fetchRange(urls, off);
      reader = resp.body.getReader();
      console.log("[pump] resp my=" + my + " status=" + resp.status);
      while(true){
        const chunk = await reader.read();
        if(chunk.done){ break; }
        if(aborted || my !== token){ console.log("[pump] stale exit my=" + my + " token=" + token); return; }
        const bytes = decBytes(off, new Uint8Array(chunk.value));
        off += chunk.value.byteLength;
        await appendBuf(sb, video, bytes);
        if(aborted || my !== token){ console.log("[pump] stale post-append my=" + my); return; }
        if(firstAppend){
          firstAppend = false;
          try{ if(video.paused || video.readyState < 3){ video.play(); } }catch(e){}
        }
      }
      if(my === token && !aborted){ try{ ms.endOfStream(); }catch(e){} }
    }catch(e){
      console.log("[pump] catch my=" + my + " token=" + token + " err=" + e.name + ":" + e.message);
      if(aborted || my !== token){ return; }
      setTimeout(function(){ if(!aborted && my === token){ pump(off); } }, 2000);
    }
  }

  /* 拖到未缓冲位置：中断旧流 → 重置分片解析器 → 从目标分片重新拉取 */
  function restartPump(chosen){
    token++;
    console.log("[restart] token=" + token + " chosen=" + chosen + " updating=" + sb.updating);
    try{ if(reader){ reader.cancel(); } }catch(e){}
    function begin(){
      try{ if(sb && !sb.updating){ sb.abort(); console.log("[restart] sb.abort done"); } }catch(e){ console.log("[restart] abort err " + e.name); }
      pump(chosen);
    }
    if(sb && sb.updating){ sb.addEventListener("updateend", begin, { once: true }); }
    else{ begin(); }
  }

  video.addEventListener("seeking", function(){
    if(aborted || !initDone){ return; }
    const t = video.currentTime;
    console.log("[seek] t=" + t + " inBuf=" + inRange(sb, t));
    if(inRange(sb, t)){ return; }
    let chosen = initEnd;
    for(let i = 1; i < flat.length; i += 2){
      if(flat[i] <= t * 1000){ chosen = flat[i + 1]; } else { break; }
    }
    restartPump(chosen);
  });

  /* 数据到达后若仍卡在等待态，主动恢复播放 */
  video.addEventListener("waiting", function(){
    if(aborted || !sb){ return; }
    if(inRange(sb, video.currentTime)){
      try{ video.play(); }catch(e){}
    }
  });
}

function openPlayer(row, v){
  if(playerBox && playerBox.dataset.src === v.地址 && playerBox.style.display === "block"){
    if(playerBox._video && playerBox._video._abortEngine){ playerBox._video._abortEngine(); }
    playerBox.remove(); playerBox = null; return;
  }
  if(playerBox){
    if(playerBox._video && playerBox._video._abortEngine){ playerBox._video._abortEngine(); }
    playerBox.remove(); playerBox = null;
  }
  const box = document.createElement("div");
  box.className = "player-box";
  box.style.display = "block";
  box.dataset.src = v.地址;
  const video = document.createElement("video");
  video.controls = true;
  video.playsInline = true;
  video.preload = "metadata";
  video.setAttribute("controlsList", "nodownload noplaybackrate");
  video.setAttribute("disablePictureInPicture", "true");
  box._video = video;

  if(MS_CTX){
    startEngine(video, v.地址, function(){
      box.innerHTML = '<div style="padding:24px;color:#888;font-size:14px">当前浏览器版本过低，请升级后查看</div>';
    });
    video.addEventListener("contextmenu", function(e){ e.preventDefault(); });
    video.addEventListener("ended", function(){ box.style.display = "none"; });
    box.appendChild(video);
    video.play().catch(function(){});
  } else {
    box.innerHTML = '<div style="padding:24px;color:#888;font-size:14px">当前浏览器版本过低，请升级后查看</div>';
  }
  row.insertAdjacentElement("afterend", box);
  playerBox = box;
}

}
