<style>
  :root{
    --text:#1f2329; --text-2:#646a73; --text-3:#8f959e;
    --line:#e5e6eb; --bg:#fff; --bg-2:#f5f6f7; --blue:#3370ff; --blue-soft:#eef3ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;font-size:15px;}
  .wrap{max-width:640px;margin:0 auto;padding:36px 20px 60px;}
  .pill{display:inline-block;font-size:13px;padding:4px 12px;border-radius:20px;background:var(--blue-soft);
    color:var(--blue);font-weight:500;margin-bottom:16px;}
  h1{font-size:30px;line-height:1.3;font-weight:700;margin:0 0 10px;letter-spacing:-.5px;}
  .sub{color:var(--text-3);font-size:14px;margin:0 0 28px;}
  .tip{background:var(--bg-2);border-radius:8px;padding:10px 14px;margin:0 0 24px;font-size:13px;
    line-height:1.55;border-left:3px solid var(--blue);}
  .h2{font-size:15px;font-weight:600;margin:26px 0 10px;color:var(--text-2);letter-spacing:.5px;}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
    border-radius:8px;margin-bottom:8px;cursor:pointer;transition:background .15s,border-color .15s;background:#fff;}
  .row:hover{background:#fafbfc;border-color:#d0d3d9;}
  .play{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:var(--blue-soft);
    display:flex;align-items:center;justify-content:center;}
  .play svg{width:15px;height:15px;fill:var(--blue);}
  .row-main{flex:0 1 auto;min-width:0;margin-right:auto;display:flex;flex-direction:column;align-items:flex-start;}
  .row-name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row-desc,.lk-d{font-size:12px;line-height:1.5;color:#565b66;margin-top:4px;white-space:nowrap;}
  .row-arrow{flex:0 0 auto;display:flex;align-items:center;line-height:1;padding-left:2px;}
  .row-arrow svg{width:24px;height:24px;display:block;}
  .player-box{position:fixed;inset:0;display:none;z-index:9999;background:#000;overflow:hidden;}
  /* 真正的video缩到极小移出屏幕，避免被浏览器"视频助手"接管；画面用canvas镜像 */
  .player-box video{position:fixed;left:-300px;top:0;width:120px;height:120px;display:block;background:#000;object-fit:contain;}
  .mirror{position:absolute;inset:0;width:100%;height:100%;display:block;}
  /* 关闭/返回按钮 */
  .closebtn{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;width:38px;height:38px;
    border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
    cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;z-index:3;}
  .closebtn svg{width:22px;height:22px;fill:#fff;}
  .player-box.bar-on .closebtn{opacity:1;pointer-events:auto;}
  .closebtn:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
  /* 自制控制条 */
  .cbar{position:absolute;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
    background:linear-gradient(transparent,rgba(0,0,0,.62));}
  .player-box.bar-on .cbar{opacity:1;transform:translateY(0);pointer-events:auto;}
  .cbtn{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;}
  .cbtn:focus-visible{outline:2px solid var(--blue);outline-offset:1px;}
  .cbtn svg{width:20px;height:20px;fill:#fff;}
  .track{flex:1;position:relative;height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none;}
  .rail{position:relative;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.3);}
  .buffered{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:rgba(255,255,255,.45);width:0;}
  .played{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:var(--blue);width:0;}
  .thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);left:0;box-shadow:0 0 4px rgba(0,0,0,.4);}
  .timetxt{flex:0 0 auto;color:#fff;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .spinner{position:absolute;top:50%;left:50%;width:42px;height:42px;margin:-21px 0 0 -21px;display:none;
    border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .fail{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:#fff;background:rgba(0,0,0,.7);font-size:14px;cursor:pointer;text-align:center;padding:20px;}
  /* 双击快进提示 */
  .seekflash{position:absolute;top:50%;width:64px;height:64px;margin:-32px 0 0;display:none;align-items:center;
    justify-content:center;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px;}
  .seekflash svg{width:26px;height:26px;fill:#fff;}
  /* 重播覆盖层 */
  .replay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.45);cursor:pointer;}
  .replay .rb{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;}
  .replay svg{width:34px;height:34px;fill:#fff;}
  /* 轻提示 */
  .toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);
    color:#fff;font-size:12px;padding:7px 14px;border-radius:16px;opacity:0;transition:opacity .25s;
    pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;}
  .toast.show{opacity:1;}
  /* 图片（二维码）区 */
  .img-grid{display:flex;flex-wrap:wrap;gap:14px;}
  .img-card{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;text-align:center;
    width:calc(50% - 7px);max-width:220px;}
  .img-card img{width:100%;display:block;border-radius:6px;background:var(--bg-2);}
  .img-card .cap{font-size:13px;color:var(--text-3);margin-top:8px;}
  .link-card{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;
    border:1px solid #c2c6cc;border-radius:8px;padding:13px 14px;margin-bottom:8px;color:var(--text);
    transition:background .15s,border-color .15s;}
  .link-card:hover{background:#fafbfc;border-color:#aab0b8;}
  .link-card .lk-ico{flex:0 0 32px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;}
  .link-card .lk-ico svg{width:28px;height:28px;display:block;}
  .link-card .lk-body{flex:0 1 auto;min-width:0;margin-right:auto;display:flex;flex-direction:column;align-items:flex-start;}
  .link-card .lk-t{font-size:16px;font-weight:600;white-space:nowrap;}
  .link-card .arrow{flex:0 0 auto;display:flex;align-items:center;line-height:1;}
  .link-card .arrow svg{width:24px;height:24px;display:block;}
  .qr-block{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff;text-align:center;
    max-width:260px;margin:10px auto 4px;}
  .qr-block .qr-img{width:100%;display:block;background:#fff;}
  .qr-block .qr-note{font-size:13px;color:var(--text-3);margin-top:10px;}
  .foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3);}
  /* 系统全屏（桌面） */
  .player-box:fullscreen{border:none;border-radius:0;}
  .player-box:fullscreen video{height:100%;}
  .player-box:-webkit-full-screen{border:none;border-radius:0;}
  @media (max-width:520px){
    .wrap{padding:26px 14px 48px;}
    h1{font-size:22px;}
    .row{padding:11px 12px;}
    .link-card{padding:13px 12px;}
    .img-card{width:calc(50% - 7px);}
    .timetxt{font-size:11px;}
    .tip{font-size:12px;padding:9px 12px;}
  }
</style>

/* 地址密文，运行时解密 */
function _d(s){
  if(!s) return "";
  const k=new TextEncoder().encode("xh-help-2026");
  const b=Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});
  return new TextDecoder().decode(b.map(function(v,i){return v ^ k[i % k.length];}));
}
/* 代理前缀（密文）；末项空串 = 官方直连，原生媒体无需 CORS */

  "EBxZGBZWXwJVWFRXCxwDHAocXw==",
  "EBxZGBZWXwJVWUZeDQoDCgoHGQNfX1cZ",
  "EBxZGBZWXwJVWEJEFxBURggDHkZXSUBXAUZDDRFD",
  "EBxZGBZWXwJVWUZeDQoDDQECH1tTQxxOARIC",
  "EBxZGBZWXwJVWBxfHAlUDRdCE0JfHw==",
  "EBxZGBZWXwJRVFwYGxpMGw0BEwNRX18Z",
  "EBxZGBZWXwJUUUFCHwFZRgYPXw==",
  "EBxZGBZWXwJVWB9GCgdVEUsPH0Ad",
  "EBxZGBZWXwJVWUZeDQoAGBcDCFQcXFtOAAFDD0sYH10d",
  ""
].map(_d);

function fmt(t){
  if(!isFinite(t)) return "0:00";
  t=Math.max(0,Math.floor(t));
  const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;
  const mm=h&&m<10?"0"+m:""+m;
  const ss=s<10?"0"+s:""+s;
  return (h?h+":" :"")+mm+":"+ss;
}

};

function openPlayer(row,v,vi){
  if(playerBox && playerBox.dataset.src===v.地址 && playerBox.style.display==="block"){
    closePlayer(); return;
  }
  if(playerBox){ closePlayer(); }
  backGuard.allow=false; backGuard.manual=false;

  const box=document.createElement("div");
  box.className="player-box";
  box.style.display="block";
  box.dataset.src=v.地址;

  const video=document.createElement("video");
  video.playsInline=true;
  video.preload="auto";
  if(v.封面){ video.poster=v.封面; }
  video.setAttribute("controlsList","nodownload");
  video.setAttribute("disablePictureInPicture","true");
  video.addEventListener("contextmenu",function(e){e.preventDefault();});

  /* 全屏canvas镜像：video离屏，画面由canvas绘制，规避浏览器视频助手接管 */
  const canvas=document.createElement("canvas");
  canvas.className="mirror";
  const ctx=canvas.getContext("2d");
  let rafId=0;
  function sizeCanvas(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(canvas.clientWidth*dpr);
    canvas.height=Math.round(canvas.clientHeight*dpr);
  }
  function drawFrame(){
    ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(video.readyState>=2&&video.videoWidth){
      const sc=Math.min(canvas.width/video.videoWidth,canvas.height/video.videoHeight);
      const dw=video.videoWidth*sc,dh=video.videoHeight*sc;
      ctx.drawImage(video,(canvas.width-dw)/2,(canvas.height-dh)/2,dw,dh);
    }
  }
  function loop(){ drawFrame(); rafId=requestAnimationFrame(loop); }
  function onResize(){ sizeCanvas(); }
  window.addEventListener("resize",onResize);
  video.addEventListener("loadedmetadata",sizeCanvas);

  /* 控制条 */
  const cbar=document.createElement("div");
  cbar.className="cbar";
  cbar.innerHTML=
    '<div class="cbtn playbtn" role="button" aria-label="播放或暂停"></div>'+
    '<div class="track" role="slider" aria-label="播放进度"><div class="rail"><div class="buffered"></div><div class="played"></div><div class="thumb"></div></div></div>'+
    '<div class="timetxt">0:00 / 0:00</div>'+
    '<div class="cbtn mutebtn" role="button" aria-label="静音切换"></div>'+
    '<div class="cbtn fsbtn" role="button" aria-label="全屏切换"></div>';
  const spinner=document.createElement("div"); spinner.className="spinner";
  const fail=document.createElement("div"); fail.className="fail";
  fail.innerHTML='<div>加载失败，点击重试</div>';
  const flash=document.createElement("div"); flash.className="seekflash";
  const replay=document.createElement("div"); replay.className="replay";
  replay.innerHTML='<div class="rb">'+REPLAY_SVG+'</div>';
  const toast=document.createElement("div"); toast.className="toast";
  const closebtn=document.createElement("div");
  closebtn.className="closebtn";
  closebtn.setAttribute("role","button");
  closebtn.setAttribute("aria-label","返回关闭");
  closebtn.innerHTML=CLOSE_SVG;

  box.appendChild(canvas);
  box.appendChild(video);
  box.appendChild(spinner);
  box.appendChild(fail);
  box.appendChild(flash);
  box.appendChild(replay);
  box.appendChild(toast);
  box.appendChild(cbar);
  box.appendChild(closebtn);

  const playbtn=cbar.querySelector(".playbtn");
  const track=cbar.querySelector(".track");
  const rail=cbar.querySelector(".rail");
  const bufferedEl=cbar.querySelector(".buffered");
  const playedEl=cbar.querySelector(".played");
  const thumbEl=cbar.querySelector(".thumb");
  const timeEl=cbar.querySelector(".timetxt");
  const mutebtn=cbar.querySelector(".mutebtn");
  const fsbtn=cbar.querySelector(".fsbtn");
  playbtn.innerHTML=PLAY_SVG;
  mutebtn.innerHTML=VOL_SVG;
  fsbtn.innerHTML=FS_SVG;

  /* 候选源：各代理 + 直连，失败自动切换 */
  const path=_d(v.地址);
  const sources=PROXY_PREFIXES.map(function(p){return p+path;});
  let srcIdx=0;
  let watchTimer=null,lastProgress=0;
  let settled=false;                 /* 是否已出画面：true 后竞速不再打扰 */
  const raceAbort=new AbortController();
  let raceDone=false;
  function loadSrc(){
    fail.style.display="none";
    video.src=sources[srcIdx];
    video.load();
    lastProgress=Date.now();
    clearInterval(watchTimer);
    /* 看门：仅当连续15秒收不到任何加载进度(progress)才判定卡死并切源；慢但在传就继续等 */
    watchTimer=setInterval(function(){
      if(video.readyState>=1){ clearInterval(watchTimer); return; }
      if(Date.now()-lastProgress>15000){
        clearInterval(watchTimer);
        if(srcIdx<sources.length-1){ srcIdx++; loadSrc(); }
      }
    },2000);
  }
  video.addEventListener("loadstart",function(){ lastProgress=Date.now(); });
  video.addEventListener("progress",function(){ lastProgress=Date.now(); });
  video.addEventListener("loadedmetadata",function(){ clearInterval(watchTimer); });
  video.addEventListener("error",function(){
    clearInterval(watchTimer);
    if(srcIdx<sources.length-1){ srcIdx++; loadSrc(); }
    else{ spinner.style.display="none"; fail.style.display="flex"; backGuard.allow=true; }
  });
  fail.addEventListener("click",function(){ srcIdx=0; loadSrc(); });

  /* 启动自动竞速：首选源立即播(不延迟)，后台并行探测允许CORS的源，
     未出画面(settled=false)时发现更快的源就切；CORS被拦/超时的源返回null，
     不报错、不阻塞，继续留在候选链里由看门狗兜底。 */
  const PROBE_BYTES=153600, PROBE_TIMEOUT=8000;
  function probeOne(url){
    return new Promise(function(resolve){
      const ctrl=new AbortController();
      function onAbort(){ ctrl.abort(); }
      raceAbort.signal.addEventListener("abort",onAbort);
      const timer=setTimeout(function(){ ctrl.abort(); },PROBE_TIMEOUT);
      const t0=Date.now();
      function finish(val){
        clearTimeout(timer);
        raceAbort.signal.removeEventListener("abort",onAbort);
        resolve(val);
      }
      if(typeof fetch!=="function"){ finish(null); return; }
      fetch(url,{headers:{Range:"bytes=0-"+(PROBE_BYTES-1)},signal:ctrl.signal})
      .then(function(r){
        if(r.status!==206){ try{ if(r.body) r.body.cancel(); }catch(_){} finish(null); return; }
        let got=0;
        if(r.body&&typeof r.body.getReader==="function"){
          const reader=r.body.getReader();
          function pump(){
            reader.read().then(function(chunk){
              if(chunk.done){ finish(got>0?{speed:got/(Date.now()-t0)}:null); return; }
              got+=chunk.value?chunk.value.length:0;
              if(got>=PROBE_BYTES){ try{reader.cancel();}catch(_){} finish({speed:got/(Date.now()-t0)}); }
              else{ pump(); }
            }).catch(function(){ finish(null); });
          }
          pump();
        }else{
          r.arrayBuffer().then(function(buf){
            got=buf.byteLength;
            finish(got>0?{speed:got/(Date.now()-t0)}:null);
          }).catch(function(){ finish(null); });
        }
      }).catch(function(){ finish(null); });
    });
  }
  function startRace(){
    if(typeof fetch!=="function"){ return; }
    const jobs=sources.map(function(url,i){
      return probeOne(url).then(function(r){ return {i:i,r:r}; });
    });
    Promise.all(jobs).then(function(results){
      if(raceDone||settled) return;
      let best=null;
      results.forEach(function(x){
        if(x.r&&(!best||x.r.speed>best.r.speed)){ best=x; }
      });
      if(!best||best.i===srcIdx||settled) return;
      srcIdx=best.i;
      loadSrc();
      video.play().catch(function(){});
      showToast("已为你切换到更快线路");
    }).catch(function(){});
  }

  /* 控制条自动隐藏 */
  let hideTimer=null;
  function showBar(){
    box.classList.add("bar-on");
    clearTimeout(hideTimer);
    if(!video.paused && !video.ended){
      hideTimer=setTimeout(function(){ box.classList.remove("bar-on"); },3000);
    }
  }
  function hideBar(){ box.classList.remove("bar-on"); clearTimeout(hideTimer); }

  /* 播放/暂停 */
  function togglePlay(){
    if(video.ended){ video.currentTime=0; video.play(); return; }
    if(video.paused){ video.play(); } else { video.pause(); }
  }
  playbtn.addEventListener("click",function(e){ e.stopPropagation(); togglePlay(); });
  video.addEventListener("play",function(){ playbtn.innerHTML=PAUSE_SVG; showBar(); });
  video.addEventListener("pause",function(){ playbtn.innerHTML=PLAY_SVG; showBar(); });

  /* 单击/双击（双击左右两侧快进 ±10s） */
  let clickTimer=null;
  function flashSeek(side,sec){
    flash.style.left=side<0?"18%":"auto";
    flash.style.right=side<0?"auto":"18%";
    flash.style.display="flex";
    flash.innerHTML=(side<0?'<svg viewBox="0 0 1024 1024"><path d="M620 200L300 512l320 312" stroke="#fff" stroke-width="90" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'<svg viewBox="0 0 1024 1024"><path d="M404 200l320 312-320 312" stroke="#fff" stroke-width="90" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>')+
      '<div style="position:absolute;bottom:6px">'+sec+'秒</div>';
    clearTimeout(flash._t);
    flash._t=setTimeout(function(){ flash.style.display="none"; },700);
  }
  function nudge(side){
    if(!isFinite(video.duration)||!isFinite(video.currentTime)){ showBar(); return; }
    let t=Math.max(0,Math.min(video.duration,video.currentTime+side*10));
    video.currentTime=t;
    flashSeek(side,10);
    showBar();
  }
  /* 单击只显示/隐藏控制条，不暂停，避免误触；暂停走播放按钮或中间双击 */
  function toggleBar(){
    if(box.classList.contains("bar-on")){ hideBar(); }
    else{ showBar(); }
  }
  canvas.addEventListener("click",function(e){
    const rect=canvas.getBoundingClientRect();
    const ratioX=(e.clientX-rect.left)/rect.width;
    if(clickTimer){
      clearTimeout(clickTimer); clickTimer=null;
      nudge(ratioX<0.34?-1:(ratioX>0.66?1:0));
      if(ratioX>0.34&&ratioX<0.66){ togglePlay(); }
      showBar();
      return;
    }
    clickTimer=setTimeout(function(){
      clickTimer=null; toggleBar();
    },280);
  });

  /* 进度更新 */
  let dragging=false;
  function updateProgress(){
    const d=video.duration||0;
    if(!dragging&&d){
      const ratio=video.currentTime/d;
      playedEl.style.width=(ratio*100)+"%";
      thumbEl.style.left=(ratio*100)+"%";
    }
    let end=0;
    for(let i=0;i<video.buffered.length;i++){
      if(video.buffered.start(i)<=video.currentTime+0.5){ end=Math.max(end,video.buffered.end(i)); }
    }
    if(d){ bufferedEl.style.width=Math.min(100,(end/d)*100)+"%"; }
    timeEl.textContent=fmt(video.currentTime)+" / "+fmt(d);
  }
  video.addEventListener("loadedmetadata",updateProgress);
  video.addEventListener("timeupdate",updateProgress);
  video.addEventListener("progress",updateProgress);

  /* 等待/加载指示 */
  video.addEventListener("waiting",function(){ spinner.style.display="block"; });
  video.addEventListener("playing",function(){ spinner.style.display="none"; backGuard.allow=true; settled=true; });
  video.addEventListener("canplay",function(){ spinner.style.display="none"; backGuard.allow=true; settled=true; });

  /* 拖动/点击进度条 */
  function ratioFromX(clientX){
    const r=rail.getBoundingClientRect();
    return Math.min(1,Math.max(0,(clientX-r.left)/r.width));
  }
  function seekToRatio(r){ if(isFinite(video.duration)){ video.currentTime=r*video.duration; } }
  track.addEventListener("pointerdown",function(e){
    dragging=true; showBar();
    try{ track.setPointerCapture(e.pointerId); }catch(_){}
    const r=ratioFromX(e.clientX);
    playedEl.style.width=(r*100)+"%";
    thumbEl.style.left=(r*100)+"%";
  });
  track.addEventListener("pointermove",function(e){
    if(!dragging) return;
    const r=ratioFromX(e.clientX);
    playedEl.style.width=(r*100)+"%";
    thumbEl.style.left=(r*100)+"%";
  });
  function endDrag(e){
    if(!dragging) return;
    dragging=false;
    seekToRatio(ratioFromX(e.clientX));
    updateProgress(); showBar();
  }
  track.addEventListener("pointerup",endDrag);
  track.addEventListener("pointercancel",function(){ dragging=false; updateProgress(); });

  /* 静音 */
  mutebtn.addEventListener("click",function(e){
    e.stopPropagation();
    video.muted=!video.muted;
  });
  video.addEventListener("volumechange",function(){
    mutebtn.innerHTML=video.muted?MUTE_SVG:VOL_SVG;
  });

  /* 全屏 */
  function isFS(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
  function toggleFS(){
    if(isFS()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else{ (box.requestFullscreen||box.webkitRequestFullscreen).call(box); }
  }
  fsbtn.addEventListener("click",function(e){ e.stopPropagation(); toggleFS(); });
  document.addEventListener("fullscreenchange",function(){
    fsbtn.innerHTML=isFS()?EXITFS_SVG:FS_SVG;
  });
  document.addEventListener("webkitfullscreenchange",function(){
    fsbtn.innerHTML=isFS()?EXITFS_SVG:FS_SVG;
  });

  /* 结束：重播层 */
  video.addEventListener("ended",function(){
    replay.style.display="flex";
  });
  replay.addEventListener("click",function(){
    replay.style.display="none";
    video.currentTime=0; video.play();
  });

  /* 不做断点续播：每次都从头开始，首帧最快、避免远距离跳转卡在转圈 */
  const saveTimer=0;

  /* 轻提示 */
  let toastTimer=null;
  function showToast(msg){
    toast.textContent=msg; toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ toast.classList.remove("show"); },2200);
  }

  /* 网络状态 */
  window.addEventListener("offline",function(){ showToast("网络已断开"); });
  window.addEventListener("online",function(){ showToast("网络已恢复"); });

  /* 键盘快捷键（桌面） */
  function onKey(e){
    if(activePlayer!==api) return;
    if(e.code==="Space"){ e.preventDefault(); togglePlay(); }
    else if(e.code==="ArrowLeft"){ e.preventDefault(); nudge(-1); }
    else if(e.code==="ArrowRight"){ e.preventDefault(); nudge(1); }
    else if(e.key==="f"||e.key==="F"){ toggleFS(); }
    else if(e.key==="m"||e.key==="M"){ video.muted=!video.muted; }
  }
  document.addEventListener("keydown",onKey);

  function cleanup(){
    raceDone=true;
    try{ raceAbort.abort(); }catch(_){}
    clearInterval(saveTimer);
    clearTimeout(hideTimer);
    clearTimeout(clickTimer);
    clearInterval(watchTimer);
    cancelAnimationFrame(rafId);
    window.removeEventListener("resize",onResize);
    document.removeEventListener("keydown",onKey);
  }

  closebtn.addEventListener("click",function(e){
    e.stopPropagation();
    backGuard.manual=true;
    if(history.state&&history.state.helpPlayer){ history.back(); }
    else{ closePlayer(); }
  });

  document.body.appendChild(box);
  document.body.style.overflow="hidden";
  try{ history.pushState({helpPlayer:1},""); }catch(e){}
  playerBox=box;

  sizeCanvas();
  loop();

  const api={ box, video, showToast, cleanup };
  activePlayer=api;

  loadSrc();
  startRace();
  video.play().catch(function(){});
  showBar();
}

/* 图片（二维码）区 */
if(me.图片&&me.图片.length){
  document.getElementById("img-sec").style.display="block";
  const iw=document.getElementById("img-wrap");
  me.图片.forEach(function(it){
    const card=document.createElement("div");
    card.className="img-card";
    card.innerHTML='<img src="'+esc(it.文件)+'" alt="'+esc(it.说明||"")+'" loading="lazy">'+
      '<div class="cap">'+esc(it.说明||"")+'</div>';
    iw.appendChild(card);
  });
}

/* 链接区：下载卡(最后一条)下方直接内嵌对应二维码，无需点击，附扫码说明 */
const lw=document.getElementById("link-wrap");
(me.链接||[]).filter(function(l){return l.显示!==false;}).forEach(function(l,idx,arr){
  const a=document.createElement("a");
  a.className="link-card";
  a.href=l.地址; a.target="_blank"; a.rel="noopener";
  a.innerHTML='<span class="lk-ico">'+(l.图标?ICO[l.图标]:(idx===0?ICO_GEM:ICO_CLOUD))+'</span>'+
    '<div class="lk-body"><div class="lk-t">'+esc(l.名称)+'</div><div class="lk-d">'+esc(l.说明)+'</div></div>'+
    '<div class="arrow">'+ARROW_SVG+'</div>';
  lw.appendChild(a);
  if(idx===arr.length-1&&me.二维码){
    const qb=document.createElement("div");
    qb.className="qr-block";
    qb.innerHTML='<img class="qr-img" src="'+esc(me.二维码)+'" alt="'+esc(me.名称)+'下载二维码" loading="lazy">'+
      '<div class="qr-note">注：浏览器扫码下载</div>';
    lw.appendChild(qb);
  }
});
</script>
</body>
</html>
